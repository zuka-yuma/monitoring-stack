groups:
  - name: storage
    rules:
      - alert: FilesystemWillFillIn4Days
        expr: >
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay|ramfs"}[6h],
            4*24*3600
          ) < 0
          and
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.4
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} が4日以内に枯渇する見込み"

      - alert: FilesystemInodesAlmostFull
        expr: node_filesystem_files_free / node_filesystem_files < 0.10
        for: 10m
        labels: {severity: warning}

      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|squashfs|overlay"} == 1
        for: 2m
        labels: {severity: critical}