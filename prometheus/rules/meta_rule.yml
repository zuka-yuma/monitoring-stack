groups:
  - name: meta
    rules:
      - alert: PrometheusCardinalityGrowing
        expr: prometheus_tsdb_head_series > 2000000
        for: 30m
        labels: {severity: warning}

      - alert: SlowScrape
        expr: scrape_duration_seconds > 10
        for: 15m
        labels: {severity: warning}

      - alert: RuleEvaluationFailing
        expr: rate(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels: {severity: critical}

      - alert: AlertmanagerNotificationFailing
        expr: rate(alertmanager_notifications_failed_total[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Slack への通知経路が死んでいる可能性"