groups:
  - name: network
    rules:
      - alert: NicDown
        expr: node_network_up{device!~"lo|veth.*|br-.*|docker.*|virbr.*|wg.*"} == 0
        for: 5m
        labels: {severity: critical}

      - alert: NicFlapping
        expr: >
          increase(
            node_network_carrier_changes_total{device!~"lo|veth.*|br-.*|docker.*"}[1h]
          ) > 4
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.device }} がフラッピング（配線/オートネゴを疑う）"

      - alert: HighTcpRetransmission
        expr: instance:node_tcp_retrans:ratio > 0.02
        for: 15m
        labels: {severity: warning}

      - alert: ConntrackAlmostFull
        expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.85
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "conntrack が枯渇寸前。新規接続が全滅する"

      - alert: ListenQueueOverflow
        expr: rate(node_netstat_TcpExt_ListenOverflows[5m]) > 0
        for: 10m
        labels: {severity: warning}

      - alert: NicBandwidthSaturated
        expr: >
          rate(node_network_receive_bytes_total[5m]) * 8
          / clamp_min(node_network_speed_bytes * 8, 1) > 0.85
        for: 15m
        labels: {severity: warning}